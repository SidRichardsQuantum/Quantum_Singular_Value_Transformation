name: Ordered Actions

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  tests:
    # Includes the Python matrix, dependency compatibility, and integration.
    uses: ./.github/workflows/tests.yml

  studio:
    uses: ./.github/workflows/studio.yml

  pages:
    runs-on: ubuntu-latest

    env:
      MPLCONFIGDIR: /tmp/matplotlib
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Install package and docs/notebook dependencies
        run: python -m pip install -e ".[test,docs]"

      - name: Check notebook contract
        run: python scripts/normalize_notebooks.py --check

      - name: Execute notebooks
        run: pytest -m notebook tests/test_real_example_notebooks.py

      - name: Verify committed notebook result artefacts
        run: |
          python scripts/extract_notebook_plots.py --preset all --write-docs
          git diff --exit-code -- docs/qsvt/tutorial_results.md docs/qsvt/real_example_results.md docs/qsvt/benchmark_results.md results/tables/real_examples_plot_manifest.csv results/tables/benchmark_plot_manifest.csv

      - name: Build docs
        run: |
          python -m sphinx -W -b html docs docs/_build/html

  package:
    # Release artifacts are built only after every validation job succeeds.
    needs: [lint, tests, studio, pages]
    uses: ./.github/workflows/package.yml
    with:
      upload_artifact: true
