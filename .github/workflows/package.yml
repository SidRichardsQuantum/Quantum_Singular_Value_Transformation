name: Package

on:
  workflow_call:
    inputs:
      upload_artifact:
        description: Upload distributions for a later publish job.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package tooling
        run: python -m pip install -e ".[release]"

      - name: Build distribution artifacts
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Smoke-test built wheel
        run: python scripts/release_check.py --wheel-smoke-only

      - name: Upload distribution artifacts
        if: inputs.upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/
