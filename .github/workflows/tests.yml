name: Tests

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"

      # Bound worker count to avoid oversubscribing numerical workloads.
      # pytest-cov combines both workers before enforcing the coverage floor.
      - name: Run pytest
        run: pytest -n 2 --dist worksteal --durations=20 -m "not notebook and not integration" --cov=qsvt --cov-report=term-missing --cov-report=xml

      - name: Upload coverage XML artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run integration tests
        run: pytest -m integration

  dependency-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: py310-min-supported
            python-version: "3.10"
            numpy-constraint: "numpy>=1.23,<2"
            pennylane-constraint: "pennylane>=0.42,<0.43"
          - name: py313-current-supported
            python-version: "3.13"
            numpy-constraint: "numpy>=2,<3"
            pennylane-constraint: "pennylane>=0.45,<0.46"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install package and constrained dependencies
        run: |
          python -m pip install -e ".[test]" "${{ matrix.numpy-constraint }}" "${{ matrix.pennylane-constraint }}"

      - name: Run compatibility smoke tests
        run: pytest -m "not notebook" tests/test_qsvt_smoke.py tests/test_execution.py tests/test_hhl_execution.py tests/test_block_encoding.py tests/test_algorithm_workflow_regressions.py tests/test_reports.py
